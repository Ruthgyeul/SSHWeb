name: CI

# Lint, typecheck, test and build on every push/PR. This does not deploy — it
# just guarantees the template always builds and stays green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # End-to-end smoke test of the WS↔SSH bridge. Runs after the build so it
      # exercises the production server against an in-memory ssh2 target.
      - run: npm run test:integration
